<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Share Kingdom TEST 3 | TOEZLANDIA</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px 16px;
      background:#111;
      color:#fff;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    .box{
      width:min(92vw,420px);
      text-align:center;
    }

    h1{
      margin:0 0 6px;
      font-size:30px;
    }

    .sub{
      margin:0 0 20px;
      opacity:.72;
    }

    #preview{
      display:none;
      width:100%;
      height:auto;
      margin:0 0 18px;
      border-radius:16px;
    }

    button{
      width:100%;
      padding:16px;
      border:0;
      border-radius:14px;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
    }

    button:disabled{
      opacity:.45;
      cursor:default;
    }

    #result{
      margin-top:16px;
      opacity:.8;
      white-space:pre-wrap;
      line-height:1.45;
      font-size:14px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>TOEZLANDIA TEST 3</h1>

    <p class="sub">Your kingdom card is ready to raid.</p>

    <img id="preview" alt="TOEZLANDIA Kingdom Card">

    <button id="shareBtn" disabled>
  Preparing Kingdom Card...
</button>

<div style="
  margin-top:10px;
  font-size:12px;
  font-weight:800;
  color:#ffd54a;
">
  ANDROID SHARE TEST 2
</div>

    <div id="result"></div>
  </div>

<script>
const API_BASE = 'https://toezlandia-ecosystem-api.onrender.com';

const params = new URLSearchParams(window.location.search);

const id = params.get('id') || '';
const kp = Number(params.get('kp') || 0);
const kingdomTitle = params.get('title') || 'Kingdom Builder';

const preview = document.getElementById('preview');
const shareBtn = document.getElementById('shareBtn');
const result = document.getElementById('result');

let kingdomFile = null;
let previewUrl = null;

function shareText(){
  const formattedKP = Number.isFinite(kp)
    ? Math.max(0, kp).toLocaleString()
    : '0';

  return (
    "I'm building my kingdom in TOEZLANDIA 🏰\n" +
    formattedKP + " Kingdom Power · " + kingdomTitle + "\n\n" +
    "Think you can build a stronger kingdom?\n\n" +
    "👣 Enter TOEZLANDIA: https://t.me/TOEZLANDIABot\n\n" +
    "#TOEZLANDIA #TOEZ"
  );
}

async function prepareCard(){
  try{
    if(!/^[a-f0-9]{32}$/.test(id)){
      throw new Error('Invalid or missing kingdom card ID.');
    }

    const response = await fetch(
      API_BASE + '/api/toezlandia/share-card/' + encodeURIComponent(id),
      {
        method:'GET',
        cache:'no-store'
      }
    );

    if(!response.ok){
      if(response.status === 404){
        throw new Error(
          'This kingdom card has expired. Return to TOEZLANDIA and share it again.'
        );
      }

      throw new Error('Could not load your kingdom card.');
    }

    const blob = await response.blob();

    if(!blob || blob.size < 100){
      throw new Error('The kingdom card image could not be loaded.');
    }

    if(blob.type && blob.type !== 'image/png'){
      throw new Error(
        'Unexpected kingdom card type: ' + blob.type
      );
    }

    kingdomFile = new File(
      [blob],
      'toezlandia-kingdom.png',
      {
        type:'image/png'
      }
    );

    previewUrl = URL.createObjectURL(blob);

    preview.src = previewUrl;
    preview.style.display = 'block';

    if(typeof navigator.share !== 'function'){
      shareBtn.textContent = 'Sharing Not Supported';
      shareBtn.disabled = true;

      result.textContent =
        'This browser does not provide the native share feature.';
      return;
    }

    shareBtn.textContent = 'Share Kingdom Card';
    shareBtn.disabled = false;

    result.textContent = '';

  }catch(e){
    console.error('Kingdom card preparation error:', e);

    shareBtn.textContent = 'Kingdom Card Unavailable';
    shareBtn.disabled = true;

    result.textContent =
      e && e.message
        ? e.message
        : 'Could not prepare your kingdom card.';
  }
}

shareBtn.addEventListener('click', async () => {
  try{
    if(!kingdomFile){
      alert(
        'SHARE TEST\n\n' +
        'ERROR: Kingdom file is not ready.'
      );
      return;
    }

    const hasShare =
      typeof navigator.share === 'function';

    let canShareFile = false;

    try{
      canShareFile =
        typeof navigator.canShare === 'function' &&
        navigator.canShare({
          files:[kingdomFile]
        });
    }catch(e){
      canShareFile = false;
    }

    alert(
      'SHARE TEST\n\n' +
      'navigator.share: ' +
      (hasShare ? 'YES' : 'NO') + '\n' +
      'PNG canShare: ' +
      (canShareFile ? 'YES' : 'NO') + '\n' +
      'File type: ' +
      kingdomFile.type + '\n' +
      'File size: ' +
      kingdomFile.size + ' bytes'
    );

    if(!hasShare){
      return;
    }

    await navigator.share({
      files:[kingdomFile],
      text:shareText()
    });

    alert(
      'SHARE RESULT\n\n' +
      'SUCCESS'
    );

  }catch(e){
    console.error('Kingdom share error:', e);

    alert(
      'SHARE RESULT\n\n' +
      'Name: ' +
      (e && e.name ? e.name : 'Unknown') + '\n' +
      'Message: ' +
      (e && e.message ? e.message : String(e))
    );
  }
});

window.addEventListener('beforeunload', () => {
  if(previewUrl){
    URL.revokeObjectURL(previewUrl);
  }
});

prepareCard();
</script>

</body>
</html>
