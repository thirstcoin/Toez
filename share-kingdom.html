<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Share TOEZLANDIA</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#111;
      color:#fff;
      font-family:system-ui,-apple-system,sans-serif;
    }

    .box{
      width:min(88vw,420px);
      text-align:center;
    }

    button{
      width:100%;
      padding:16px;
      border:0;
      border-radius:14px;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
    }

    #result{
      margin-top:18px;
      opacity:.8;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>TOEZLANDIA</h1>

    <p>Android Share Test</p>

    <button id="testShare">
      Test Native Share
    </button>

    <div id="result"></div>
  </div>

<script>
const result = document.getElementById('result');

document.getElementById('testShare').onclick = async () => {
  try{
    if(!navigator.share){
      result.textContent = 'navigator.share: NO';
      return;
    }

    await navigator.share({
      text:
        "I'm building my kingdom in TOEZLANDIA 🏰\n\n" +
        "Think you can build a stronger kingdom?\n\n" +
        "👣 Enter TOEZLANDIA: https://t.me/TOEZLANDIABot"
    });

    result.textContent = 'Native share opened successfully.';

  }catch(e){
    if(e && e.name === 'AbortError') return;

    result.textContent =
      'Name: ' + (e?.name || 'unknown') +
      '\nMessage: ' + (e?.message || String(e));
  }
};
</script>

</body>
</html>
