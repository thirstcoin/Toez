<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#150D22">
<title>Toezlandia — A Kingdom Built One Step at a Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#150D22; --velvet:#20132F; --panel:#2B1940; --panel-2:#3A2354;
  --purple:#7B4BB7; --purple-lo:#4E2E77;
  --gold:#E9B84C; --gold-lo:#A8813A; --gold-hi:#FFD98A;
  --parch:#F0E3C6; --muted:#B49FCB;
  --jade:#54A98C; --rose:#C96A8E; --stone:#9AA6BF;
  --line:rgba(233,184,76,.22);
  --sheet:#1C1029;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--ink); color:var(--parch);
  font-family:'Jost',system-ui,sans-serif; font-weight:400;
  overscroll-behavior:none; user-select:none;
}
/* App is a fixed-height flex column: header, main, nav. Only <main> scrolls.
   This is deliberate: position:fixed becomes fixed to the nearest transformed
   ancestor, not the real viewport, the moment anything up the tree applies a
   CSS transform (which mobile preview frames commonly do). A fixed-height
   shell with one internally-scrolling region sidesteps that entirely. */
#app{
  max-width:460px; margin:0 auto;
  height:100vh; height:100dvh;
  display:flex; flex-direction:column; position:relative; overflow:hidden;
  background:linear-gradient(180deg,#1B1029,#150D22 40%);
  box-shadow:0 0 80px rgba(0,0,0,.6);
}

/* ---------- top banner ---------- */
.crown{
  flex:none;
  background:linear-gradient(180deg,#2B1940 0%,#20132F 100%);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
}
.crown-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.kp{display:flex;align-items:baseline;gap:7px}
.kp b{font-family:'Cinzel';font-weight:700;font-size:25px;color:var(--gold-hi);line-height:1;letter-spacing:.5px}
.kp span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.title-now{font-family:'Cinzel';font-size:12px;color:var(--parch);text-align:right;line-height:1.25;max-width:46%}
.title-now em{display:block;font-style:normal;font-size:10px;color:var(--muted);font-family:'Jost'}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.res div{
  background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.05);
  border-radius:8px; padding:5px 4px 4px; text-align:center;
}
.res b{display:block;font-size:13.5px;font-weight:500;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.res small{display:block;font-size:8.5px;color:var(--muted);margin-top:1px;letter-spacing:.08em}
.res .rate{font-size:8.5px;color:rgba(255,255,255,.32);font-variant-numeric:tabular-nums}
.r-gold b{color:var(--gold)} .r-food b{color:var(--jade)}
.r-mat b{color:var(--stone)} .r-com b{color:var(--rose)}
.boost{
  margin-top:7px;font-size:10.5px;color:var(--gold-hi);text-align:center;
  background:rgba(233,184,76,.09);border:1px solid var(--line);border-radius:6px;padding:3px;
}

/* ---------- views ---------- */
main{flex:1;min-height:0;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none;animation:in .18s ease-out}
.view.on{display:block}
@keyframes in{from{opacity:0}to{opacity:1}}
/* Respect the OS "Reduce Motion" setting by default — but ambient motion is
   the point of the map, so offer an explicit opt-in that overrides it.
   A blanket `*{animation:none}` here silently kills the whole effect layer. */
@media (prefers-reduced-motion:reduce){
  .view,.toast{animation:none!important}
  #sheet{transition:none!important}
  #fx{display:none}
}
body.motion-on  #fx{display:block!important}
body.motion-off #fx{display:none!important}

/* ---------- map ---------- */
#mapwrap{position:relative;line-height:0}
#mapwrap img{width:100%;display:block}

/* ---------- ambient motion ----------
   No CSS mask anywhere: mask-image silently fails in some webviews and the
   patches show up as pasted rectangles. Instead the edge fade is baked into
   each texture's alpha channel (left/right), and a static copy of the real
   map pixels is laid over the top and bottom bands to hide those seams.
   Water tiles are wrap-blended, so --tile is both the tile height and the
   scroll distance: translating exactly one tile loops forever. */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fx.paused *{animation-play-state:paused!important}

.fall{position:absolute;overflow:hidden;
  left:var(--l);top:var(--t);width:var(--w);height:var(--h)}
.fall i{
  position:absolute;left:0;width:100%;top:0;height:200%;
  background-repeat:repeat-y;background-size:100% var(--tile);
  animation:flow var(--dur) linear infinite;
}
.fall u{                       /* static original-pixel edge cover */
  position:absolute;inset:0;background-size:100% 100%;
  background-repeat:no-repeat;
}
@keyframes flow{
  from{transform:translateY(calc(-1 * var(--tile)))}
  to  {transform:translateY(0)}
}

.boats{position:absolute;left:var(--l);top:var(--t);width:var(--w);height:var(--h)}
.boats i{
  position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;
  transform-origin:50% 86%;            /* pivot at the waterline, so hulls sit still */
  animation:sway 5.5s ease-in-out infinite;
}
@keyframes sway{
  0%,100%{transform:rotate(-1.1deg) translateY(0)}
  50%    {transform:rotate(1.1deg)  translateY(-2.5px)}
}

/* drifting cloud + mist bands, drawn not extracted (extracting cloud texture
   from the mountains tears on loop) */
.band{position:absolute;left:0;width:100%;pointer-events:none;mix-blend-mode:screen;overflow:hidden}
/* svg is 200% wide with every shape drawn twice, 100 viewBox-units apart, so
   translating the svg itself by -50% lands exactly on the duplicate. Animating
   the <g> instead would resolve % against the group bbox, not the viewBox. */
.band svg{width:200%;height:100%;display:block;animation:drift var(--dur) linear infinite;will-change:transform}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.node{
  position:absolute; transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  border:0;background:none;padding:0;cursor:pointer;
}
.medal{
  width:42px;height:42px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4A2C6E,#1A0F28);
  border:2px solid var(--gold-lo);
  display:grid;place-items:center;font-size:19px;line-height:1;
  box-shadow:0 3px 10px rgba(0,0,0,.55);
}
.node.ready .medal{border-color:var(--gold-hi);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(233,184,76,.45),0 3px 10px rgba(0,0,0,.55)}50%{box-shadow:0 0 0 7px rgba(233,184,76,0),0 3px 10px rgba(0,0,0,.55)}}
.node.locked .medal{filter:grayscale(1) brightness(.5);border-color:#5a5a6b}
.node .lv{
  font-family:'Cinzel';font-size:9.5px;font-weight:700;color:#1B1029;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));
  padding:1px 6px;border-radius:20px;letter-spacing:.4px;line-height:1.5;
}
.node.locked .lv{background:#4a4458;color:#c9c4d4}
.foot{position:absolute;font-size:13px;opacity:.32;transform:translate(-50%,-50%) rotate(var(--r));pointer-events:none;filter:sepia(1) saturate(3) hue-rotate(5deg)}

/* ---------- generic ---------- */
.pad{padding:14px 14px 4px}
h2{font-family:'Cinzel';font-weight:700;font-size:17px;margin:0 0 3px;color:var(--gold-hi);letter-spacing:.4px}
.sub{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.card{
  background:linear-gradient(180deg,var(--panel),#241634);
  border:1px solid rgba(255,255,255,.06); border-left:3px solid var(--purple-lo);
  border-radius:10px; padding:11px 12px; margin-bottom:9px;
}
.card.done{border-left-color:var(--jade);opacity:.62}
.card h3{margin:0;font-size:13.5px;font-weight:500;letter-spacing:.2px}
.card p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4}
.bar{height:5px;background:rgba(0,0,0,.38);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--gold));border-radius:4px;transition:width .3s}
.rowend{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:6px}
.reward{font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums}
button.act{
  font-family:'Jost';font-weight:600;font-size:13px;letter-spacing:.3px;
  background:linear-gradient(180deg,var(--gold),var(--gold-lo));
  color:#1B1029;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;
}
button.act:disabled{background:#3a3348;color:#7e768f;cursor:default}
button.act.ghost{background:none;border:1px solid var(--line);color:var(--parch)}
button.act:focus-visible,.node:focus-visible,.tab:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.small{font-size:11px;color:var(--muted)}

/* ---------- sheet ----------
   Anchored to #app (position:absolute, not fixed) so it overlays correctly
   no matter what the outer preview frame does to the real viewport. */
#scrim{position:absolute;inset:0;background:rgba(8,4,14,.72);z-index:50;display:none}
#scrim.on{display:block}
#sheet{
  position:absolute;left:0;right:0;transform:translateY(102%);
  bottom:0;width:100%;z-index:51;
  background:var(--sheet);border-top:2px solid var(--gold-lo);
  border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);
  transition:transform .22s cubic-bezier(.2,.8,.3,1);max-height:86vh;overflow-y:auto;
}
#sheet.on{transform:translateY(0)}
.sheet-h{display:flex;gap:11px;align-items:center;margin-bottom:3px}
.sheet-h .medal{width:46px;height:46px;font-size:21px;flex:0 0 auto}
.sheet-h h2{margin:0;font-size:16px}
.stage{font-size:11.5px;color:var(--muted);margin:1px 0 0}
.prod{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{font-size:11px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:3px 10px;font-variant-numeric:tabular-nums}
.cost{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.cost .chip.no{color:#E08B8B;border-color:rgba(224,139,139,.3)}
.lore{border-left:2px solid var(--purple);padding-left:10px;margin:12px 0 0;font-size:12px;color:#D6C4EE;line-height:1.5;font-style:italic}

/* ---------- nav ---------- */
nav{
  flex:none;display:grid;grid-template-columns:repeat(4,1fr);
  background:linear-gradient(180deg,#251639,#1A1027);border-top:1px solid var(--line);
  padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);
}
.tab{background:none;border:0;color:var(--muted);font-family:'Jost';font-size:10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;letter-spacing:.05em}
.tab i{font-style:normal;font-size:17px;filter:grayscale(1) opacity(.65)}
.tab.on{color:var(--gold-hi)} .tab.on i{filter:none}
.tab .dot{position:absolute;margin:-3px 0 0 15px;width:6px;height:6px;border-radius:50%;background:var(--rose);display:none}
.tab.alert .dot{display:block}

/* ---------- toast ---------- */
#toasts{position:absolute;left:0;right:0;bottom:86px;z-index:60;width:100%;pointer-events:none;padding:0 14px}
.toast{
  background:rgba(43,25,64,.96);border:1px solid var(--line);border-radius:9px;
  padding:8px 12px;font-size:12px;margin-top:6px;animation:rise .25s ease-out;
  box-shadow:0 6px 18px rgba(0,0,0,.5)
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- misc ---------- */
.lbrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;background:rgba(0,0,0,.2);margin-bottom:6px;border:1px solid transparent}
.lbrow.me{border-color:var(--gold-lo);background:rgba(233,184,76,.09)}
.lbrow .rk{font-family:'Cinzel';font-weight:700;font-size:13px;color:var(--gold);width:26px;text-align:center;flex:0 0 auto}
.lbrow .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .vl{font-size:13px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.lbrow .tt{font-size:10px;color:var(--muted)}
.seg{display:flex;gap:6px;margin-bottom:11px}
.seg button{flex:1;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06);color:var(--muted);
  border-radius:7px;padding:7px 4px;font-family:'Jost';font-size:11.5px;cursor:pointer}
.seg button.on{background:var(--purple-lo);color:var(--parch);border-color:var(--purple)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tal{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:10px;text-align:left}
.tal.owned{border-color:var(--jade);background:rgba(84,169,140,.1)}
.tal h4{margin:0 0 3px;font-size:12.5px;font-weight:500;font-family:'Cinzel'}
.tal p{margin:0 0 7px;font-size:10.5px;color:var(--muted);line-height:1.35}
.tal .pr{font-size:11px;color:var(--gold)}
.lorepage{border-left:2px solid var(--purple-lo);padding:2px 0 2px 11px;margin-bottom:12px}
.lorepage h4{margin:0;font-family:'Cinzel';font-size:12.5px;color:var(--gold-hi)}
.lorepage p{margin:3px 0 0;font-size:11.5px;color:#CBB9E4;line-height:1.5;font-style:italic}
.lorepage.hidden h4{color:#6C607E}.lorepage.hidden p{color:#5B5170;font-style:normal}
#cardCanvas{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.evt-choice{width:100%;text-align:left;margin-top:7px}
footer{padding:18px 14px calc(env(safe-area-inset-bottom) + 12px);text-align:center;font-size:10px;color:#5B5170;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <header class="crown">
    <div class="crown-top">
      <div class="kp"><b id="kpVal">0</b><span>Kingdom Power</span></div>
      <div class="title-now" id="titleNow">Wanderer<em>Streak: day 1</em></div>
    </div>
    <div class="res">
      <div class="r-gold"><b id="rGold">0</b><small>Gold</small><span class="rate" id="sGold">0/s</span></div>
      <div class="r-food"><b id="rFood">0</b><small>Food</small><span class="rate" id="sFood">0/s</span></div>
      <div class="r-mat"><b id="rMat">0</b><small>Materials</small><span class="rate" id="sMat">0/s</span></div>
      <div class="r-com"><b id="rCom">0</b><small>Community</small><span class="rate" id="sCom">0/s</span></div>
    </div>
    <div class="boost" id="boostBar" style="display:none"></div>
  </header>

  <main>
    <section class="view on" id="v-map">
      <div id="mapwrap"><img id="mapImg" alt="Map of Toezlandia"><div id="fx"></div><div id="nodes"></div></div>
      <div class="pad">
        <div class="card" id="festivalCard"></div>
        <p class="small" style="text-align:center;margin:2px 0 0">Tap a district to build it up.</p>
        <div style="text-align:center;margin-top:9px">
          <button class="act ghost" id="btnMotion" style="font-size:11px;padding:6px 13px">Ambient motion</button>
        </div>
      </div>
    </section>

    <section class="view" id="v-quests">
      <div class="pad">
        <h2>Today in the kingdom</h2>
        <p class="sub" id="questSub"></p>
        <div id="dailyList"></div>
        <h2 style="margin-top:18px">This week</h2>
        <p class="sub" id="weekSub"></p>
        <div id="weeklyList"></div>
        <h2 style="margin-top:18px">Kingdom streak</h2>
        <p class="sub" id="streakSub"></p>
        <div id="streakList"></div>
      </div>
    </section>

    <section class="view" id="v-realm">
      <div class="pad">
        <div class="seg">
          <button data-seg="asc" class="on">One Step Further</button>
          <button data-seg="lore">Records</button>
          <button data-seg="coll">Collection</button>
        </div>
        <div id="seg-asc"></div>
        <div id="seg-lore" style="display:none"></div>
        <div id="seg-coll" style="display:none"></div>
      </div>
    </section>

    <section class="view" id="v-rank">
      <div class="pad">
        <div class="seg">
          <button data-lb="growth" class="on">Weekly growth</button>
          <button data-lb="total">Top kingdoms</button>
        </div>
        <p class="sub" id="lbSub"></p>
        <div id="lbList"></div>
        <h2 style="margin-top:20px">Share your kingdom</h2>
        <p class="sub">A card with your power, title and streak.</p>
        <canvas id="cardCanvas" width="900" height="1125"></canvas>
        <div class="rowend" style="margin-top:10px">
          <button class="act ghost" id="btnRedraw">Refresh card</button>
          <button class="act" id="btnSaveCard">Save image</button>
        </div>
      </div>
      <footer>
        Toezlandia V1 · saves to this device<br>
        Different feet, same journey.
      </footer>
    </section>
  </main>

  <nav>
    <button class="tab on" data-v="map"><i>🏰</i>Kingdom<span class="dot"></span></button>
    <button class="tab" data-v="quests"><i>📜</i>Quests<span class="dot"></span></button>
    <button class="tab" data-v="realm"><i>👣</i>Realm<span class="dot"></span></button>
    <button class="tab" data-v="rank"><i>🏆</i>Rank<span class="dot"></span></button>
  </nav>
</div>

<div id="scrim"></div>

const PATHS = { id:'paths', name:'Well-Trodden Paths', base:4, step:2, desc:'+3% to everything, every rank.' };

const LORE = [

const EVENTS = [
  { id:'harvest', ttl:'Harvest Day', txt:'The fields came in heavy and early.',
    choices:[{l:'Bring it all in', fx:s=>boost(s,'food',3,10)}] },

      {l:'Pay for repairs', need:s=>({materials:Math.max(50,pps(s).materials*400)}),
       fx:s=>{grant(s,{gold:Math.max(200,pps(s).gold*1400)}); return 'The road pays for itself.';}},
      {l:'Leave it for now', fx:s=>'The bridge holds. Probably.'} ] },

/* ============================ state ============================ */
const DKEYS = ['gold','food','materials','community'];
function freshCounters(){ return {gold:0,food:0,materials:0,community:0,upgrades:0,claims:0,events:0,festivals:0,marketUp:0,unlocks:0}; }

function newKingdom(st){
  const b = {};
  DISTRICTS.forEach(d=>b[d.id] = {lv:0});
  b.village.lv = 1; b.farmtoes.lv = 1;
  if(st && st.talents.includes('swift')) b.market.lv = 1;
  return b;
}

function newState(){
  return {
    v:1, name:'', created:Date.now(), last:Date.now(),
    res:{gold:BALANCE.START_GOLD, food:0, materials:0, community:0},
    b:newKingdom(null),
    kp:0, peak:0, banked:0, lifeWeekStart:0,
    streak:1, best:1, lastDay:dayNum(), dayDone:[],
    d:freshCounters(), w:freshCounters(), dayKey:dayNum(), weekKey:weekNum(),
    missionsD:[], missionsW:[], claimedD:[], claimedW:[], claimedStreak:[],
    boosts:[], festivalsWeek:0, festivalUntil:0,
    footprints:0, talents:[], paths:0, ascensions:0, lore:0, motion:true,
    relics:[], titlesSeen:[], pendingEvent:null, nextEvent:Date.now()+1000*60*5
  };
}

/* ============================ helpers ============================ */
const now = () => Date.now();
const dayNum  = (t=now()) => Math.floor(t/864e5);
const weekNum = (t=now()) => Math.floor((t/864e5 + 4)/7);   // ISO-ish, weeks roll Monday UTC
function fmt(n){
  n = Math.floor(n);
  if(n < 1000) return ''+n;
  const u = ['K','M','B','T','Qa','Qi'];
  let i = -1; while(n >= 1000 && i < u.length-1){ n/=1000; i++; }
  return (n<10 ? n.toFixed(1) : Math.floor(n)) + u[i];
}
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---- production ---- */
function palaceMult(s){ return 1 + BALANCE.PALACE_BOOST * s.b.palace.lv; }
function talentMult(s, key){
  let m = 1 + 0.03*s.paths;
  if(key==='gold' && s.talents.includes('golden')) m *= 1.25;
  if((key==='food'||key==='materials') && s.talents.includes('roots')) m *= 1.25;
  return m;
}
function boostMult(s, key){
  let m = 1;
  s.boosts.forEach(bo=>{ if(bo.until>now() && (bo.key===key||bo.key==='all')) m *= bo.mult; });
  if(s.festivalUntil > now()) m *= BALANCE.FESTIVAL_MULT;
  return m;
}
/* per-second production of every resource */
function pps(s){
  const out = {gold:0,food:0,materials:0,community:0};
  DISTRICTS.forEach(d=>{
    const lv = s.b[d.id].lv; if(lv<1) return;
    const scale = Math.pow(BALANCE.PROD_MULT, lv-1);
    for(const k in d.prod) out[k] += d.prod[k]*scale;
  });
  const pm = palaceMult(s);
  DKEYS.forEach(k=>{ out[k] *= pm * talentMult(s,k) * boostMult(s,k); });
  return out;
}
function upgradeCost(d, lv){
  const m = Math.pow(BALANCE.COST_MULT, Math.max(0,lv-1));
  const c = {}; for(const k in d.cost) c[k] = Math.ceil(d.cost[k]*m);
  return c;
}
function canPay(s, c){ return Object.keys(c).every(k=>s.res[k] >= c[k]); }
function pay(s, c){ for(const k in c) s.res[k] -= c[k]; }

/* ---- Kingdom Power: derived only, never stored as truth ---- */
function computeKP(s){
  let kp = 0;
  DISTRICTS.forEach(d=>{
    const lv = s.b[d.id].lv;
    if(lv>0){ kp += d.w * (lv*(lv+1)/2); kp += 25; }
  });
  kp += 2*(s.claimedD.length + (s.lifetimeD||0));
  kp += 15*(s.claimedW.length + (s.lifetimeW||0));
  kp += 3*s.streak + 1*s.best;
  kp += 10*s.relics.length;
  return Math.floor(kp);
}
const lifetimeKP = s => (s.banked||0) + s.kp;
function titleFor(kp){ let t = TITLES[0][1]; TITLES.forEach(([n,x])=>{ if(kp>=n) t=x; }); return t; }
function nextTitle(kp){ return TITLES.find(([n])=>kp<n) || null; }

function grant(s, obj){ for(const k in obj){ s.res[k]+=obj[k]; s.d[k]+=obj[k]; s.w[k]+=obj[k]; } return null; }
function boost(s, key, mult, mins){ s.boosts.push({key,mult,until:now()+mins*60000, label:key}); return null; }
function unlockRelic(s, name){ if(!s.relics.includes(name)) s.relics.push(name); }

/* ============================ persistence ============================
   Local by default. To go server-authoritative:
     1. set MODE='server' and API_BASE
     2. server owns the clock: it recomputes accrual from its own last_claim_at,
        derives streak from UTC date diff, and recomputes KP with computeKP().
        Never trust a client-sent kp, res or streak.
     3. the client sends intents only: {type:'upgrade',id}, {type:'claim'},
        {type:'festival'}, {type:'ascend'}, {type:'mission',id}
   ==================================================================== */
const MODE = 'local';                 // 'local' | 'server'
const API_BASE = 'https://YOUR-API.onrender.com';
const LS_KEY = 'toezlandia_v1';

const Persistence = {
  async load(){
    if(MODE==='local'){
      try{ const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
      catch(e){ return null; }
    }
    const r = await fetch(API_BASE+'/state',{credentials:'include'});
    return r.ok ? r.json() : null;
  },
  async save(s){
    if(MODE==='local'){
      try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){}
      return;
    }
    // server build: replace with intent posts; this full-state PUT is local-only
    await fetch(API_BASE+'/state',{method:'PUT',credentials:'include',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(s)});
  },
  async leaderboard(kind, s){
    if(MODE==='local') return seedBoard(kind, s);
    const r = await fetch(`${API_BASE}/leaderboard?kind=${kind}`,{credentials:'include'});
    return r.ok ? r.json() : seedBoard(kind, s);
  }
};

/* Placeholder rivals so the board is never empty on a fresh install.
   Deterministic growth, so ranks move day to day without a server. */
const RIVAL_NAMES = ['Bigtoe Barony','Sole Survivors','House Pinky','Ten Down','Archfoot',
  'Frosttoe Hold','Kindred Steps','The Bunion Kings','Pigsy’s Rest','Jazzy Heights',
  'Stoez Keep','PJ’s Landing','Barefoot Republic','Arch Angels','Heel Turn'];
function seedBoard(kind, s){
  const age = Math.max(1,(now()-s.created)/864e5);
  const rows = RIVAL_NAMES.map((nm,i)=>{
    const r = mulberry(i*7919+13);
    const pace = 90 + r()*420;
    const total = Math.floor(pace*Math.pow(age+1+r()*6, 1.25));
    const growth = Math.floor(total*(0.12+r()*0.3));
    return { name:nm, total, growth, title:titleFor(total), me:false };
  });
  const life = lifetimeKP(s);
  rows.push({ name: s.name||'Your Kingdom', total:life, growth:Math.max(0,life-(s.lifeWeekStart||0)),
              title:titleFor(s.peak||s.kp), me:true });
  rows.sort((a,b)=> (kind==='growth' ? b.growth-a.growth : b.total-a.total));
  return rows.slice(0,20);
}
</script>
<script>
/* ============================ missions ============================ */
const DPOOL = [
  {k:'gold',      base:500, l:n=>`Collect ${fmt(n)} gold`},
  {k:'food',      base:300, l:n=>`Harvest ${fmt(n)} food`},
  {k:'materials', base:200, l:n=>`Gather ${fmt(n)} materials`},
  {k:'community', base:40,  l:n=>`Earn ${fmt(n)} community`},
  {k:'upgrades',  base:2, flat:1, l:n=>`Upgrade ${n} buildings`},
  {k:'claims',    base:3, flat:1, l:n=>`Claim resources ${n} times`},
  {k:'marketUp',  base:1, flat:1, l:()=>'Upgrade Market Toes once'},
  {k:'events',    base:1, flat:1, l:()=>'Resolve a kingdom event'},
  {k:'festivals', base:1, flat:1, l:()=>'Hold a festival in Unity Square'}
];
const WPOOL = [
  {k:'gold',      base:6000, l:n=>`Collect ${fmt(n)} gold this week`},
  {k:'food',      base:3000, l:n=>`Harvest ${fmt(n)} food this week`},
  {k:'materials', base:2500, l:n=>`Gather ${fmt(n)} materials this week`},
  {k:'upgrades',  base:10, flat:1, l:n=>`Upgrade ${n} buildings this week`},
  {k:'unlocks',   base:1,  flat:1, l:n=>`Open ${n} new district`},
  {k:'events',    base:5,  flat:1, l:n=>`Resolve ${n} kingdom events`},
  {k:'kpgain',    base:150, l:n=>`Add ${fmt(n)} Kingdom Power this week`}
];

function scaleOf(s){ return Math.max(1, Math.pow(Math.max(1,s.kp)/90, 1.05)); }

function rollMissions(s){
  const sc = scaleOf(s);
  const slots = 3 + (s.talents.includes('wander') ? 1 : 0);
  const rd = mulberry(s.dayKey*31 + 7);
  const pool = DPOOL.slice();
  s.missionsD = [];
  for(let i=0;i<slots && pool.length;i++){
    const m = pool.splice(Math.floor(rd()*pool.length),1)[0];
    const t = m.flat ? m.base : Math.ceil(m.base*sc/10)*10;
    s.missionsD.push({k:m.k, t, txt:m.l(t), rw:dailyReward(s,i)});
  }
  const rw = mulberry(s.weekKey*97 + 3);
  const wp = WPOOL.slice(); s.missionsW = [];
  for(let i=0;i<3 && wp.length;i++){
    const m = wp.splice(Math.floor(rw()*wp.length),1)[0];
    const t = m.flat ? m.base : Math.ceil(m.base*sc/10)*10;
    s.missionsW.push({k:m.k, t, txt:m.l(t), rw:weeklyReward(s,i)});
  }
}
function dailyReward(s,i){
  const p = pps(s), n = x=>Math.max(20, Math.floor(x*180));
  return [ {gold:n(p.gold)}, {materials:Math.max(15,n(p.materials))}, {community:Math.max(10,n(p.community)/2)},
           {food:Math.max(20,n(p.food))} ][i%4];
}
function weeklyReward(s,i){
  const p = pps(s), n = x=>Math.max(150, Math.floor(x*900));
  return [ {gold:n(p.gold), community:Math.max(40,n(p.community)/3)},
           {materials:Math.max(120,n(p.materials)), gold:n(p.gold)/2},
           {community:Math.max(80,n(p.community)/2), food:Math.max(120,n(p.food))} ][i%3];
}
function progressOf(s, m, weekly){
  if(m.k==='kpgain') return Math.max(0, lifetimeKP(s) - (s.lifeWeekStart||0));
  return (weekly ? s.w : s.d)[m.k] || 0;
}
const STREAK_REWARDS = [
  [1,'Gold bundle',   s=>({gold:Math.max(150,pps(s).gold*400)})],
  [3,'Materials run', s=>({materials:Math.max(80,pps(s).materials*500)})],
  [5,'Community feast',s=>({community:Math.max(60,pps(s).community*600)})],
  [7,'Kingdom banner',s=>{unlockRelic(s,'Seven-Day Banner'); return {};}],
  [14,'Title: Steadfast',s=>{unlockRelic(s,'Title: Steadfast'); return {};}],
  [30,'Realm decoration',s=>{unlockRelic(s,'Everbright Torch'); return {};}]
];

/* ============================ rollover ============================ */
function rollover(s){
  const d = dayNum(), w = weekNum();
  let changed = false;
  if(d !== s.dayKey){
    s.lifetimeD = (s.lifetimeD||0) + s.claimedD.length;
    if(s.claimedD.length >= s.missionsD.length && s.missionsD.length) s.dayDone.push(s.dayKey);
    s.streak = (d - s.lastDay === 1) ? s.streak+1 : 1;
    s.best = Math.max(s.best, s.streak);
    s.lastDay = d; s.dayKey = d; s.d = freshCounters(); s.claimedD = [];
    changed = true;
  }
  if(w !== s.weekKey){
    s.lifetimeW = (s.lifetimeW||0) + s.claimedW.length;
    s.weekKey = w; s.w = freshCounters(); s.claimedW = [];
    s.festivalsWeek = 0; s.lifeWeekStart = lifetimeKP(s); changed = true;
  }
  if(changed) rollMissions(s);
  return changed;
}

/* ============================ engine ============================ */
let S = null, dirty = false;

function accrue(s, seconds, rate=1){
  const p = pps(s);
  DKEYS.forEach(k=>{
    const g = p[k]*seconds*rate;
    s.res[k] += g; s.d[k] += g; s.w[k] += g;
  });
}
function tick(){
  const t = now();
  const dt = Math.min(5, (t - S.last)/1000);
  if(dt > 0){ accrue(S, dt); S.last = t; }
  S.boosts = S.boosts.filter(b=>b.until > t);
  if(rollover(S)) { renderAll(); }
  S.kp = computeKP(S);
  if(S.kp > (S.peak||0)) S.peak = S.kp;
  maybeEvent();
  dirty = true;
}
function maybeEvent(){
  if(S.pendingEvent || now() < S.nextEvent) return;
  const e = EVENTS[Math.floor(Math.random()*EVENTS.length)];
  S.pendingEvent = e.id;
  S.nextEvent = now() + (4 + Math.random()*6)*60000;
  openEvent(e);
}

function doUpgrade(id){
  const d = DISTRICTS.find(x=>x.id===id), st = S.b[id];
  if(st.lv === 0){
    if(!canPay(S,d.unlock)) return toast('Not enough to open '+d.name+' yet.');
    pay(S,d.unlock); st.lv = 1; S.d.unlocks++; S.w.unlocks++;
    toast('🏳️ '+d.name+' joins the kingdom.');
  } else {
    if(st.lv >= BALANCE.MAX_LEVEL) return toast(d.name+' is fully built.');
    const c = upgradeCost(d, st.lv);
    if(!canPay(S,c)) return toast('Not enough for that upgrade.');
    pay(S,c); st.lv++;
    S.d.upgrades++; S.w.upgrades++;
    if(id==='market'){ S.d.marketUp++; S.w.marketUp++; }
  }
  S.kp = computeKP(S);
  save(); renderAll(); openDistrict(id);
}
function holdFestival(){
  const cost = festivalCost();
  if(S.b.unity.lv < 1) return toast('Unity Square has to be open first.');
  if(S.res.community < cost) return toast('Not enough community for a festival.');
  S.res.community -= cost; S.festivalsWeek++;
  S.festivalUntil = Math.max(now(), S.festivalUntil) + BALANCE.FESTIVAL_MINS*60000;
  S.d.festivals++; S.w.festivals++;
  toast('🎉 Festival under way. Everything produces 50% more.');
  save(); renderAll();
}
// 15 minutes of community output, doubling-ish each time you repeat it in a week
function festivalCost(){
  const raw = pps(S).community / boostMult(S,'community');
  return Math.ceil(Math.max(BALANCE.FESTIVAL_BASE, raw*900) * Math.pow(1.8, S.festivalsWeek));
}

function claimMission(i, weekly){
  const list = weekly ? S.missionsW : S.missionsD;
  const done = weekly ? S.claimedW : S.claimedD;
  const m = list[i];
  if(done.includes(i) || progressOf(S,m,weekly) < m.t) return;
  done.push(i); grant(S, m.rw);
  S.kp = computeKP(S);
  toast('Quest complete. '+rewardText(m.rw));
  save(); renderAll();
}
function claimStreak(day){
  if(S.claimedStreak.includes(day) || S.streak < day) return;
  const r = STREAK_REWARDS.find(x=>x[0]===day);
  S.claimedStreak.push(day);
  const got = r[2](S); grant(S, got);
  S.kp = computeKP(S);
  toast('Day '+day+' reward claimed.');
  save(); renderAll();
}
function rewardText(rw){
  return Object.keys(rw).map(k=>fmt(rw[k])+' '+k).join(', ') || 'a keepsake';
}

/* ---- ascension ---- */
const footprintsFor = kp => Math.floor(Math.pow(Math.max(0,kp), BALANCE.FOOT_EXP)/BALANCE.FOOT_DIV);
function ascend(){
  if(S.kp < BALANCE.ASCEND_MIN_KP) return;
  const got = footprintsFor(S.kp);
  const keepCom = S.talents.includes('kind') ? S.res.community : 0;
  S.banked = (S.banked||0) + S.kp;
  S.footprints += got; S.ascensions++;
  if(S.lore < LORE.length) S.lore++;
  S.res = {gold:BALANCE.START_GOLD, food:0, materials:0, community:keepCom};
  S.b = newKingdom(S);
  S.boosts = []; S.festivalUntil = 0;
  S.kp = computeKP(S);
  save(); renderAll();
  sheetHTML(`<h2>One step further</h2>
    <p class="sub">The kingdom resets. The paths remain.</p>
    <div class="card"><h3>+${got} footprints</h3><p>Spend them in the Realm tab. They never reset.</p></div>
    ${S.lore<=LORE.length?`<div class="lorepage"><h4>${LORE[S.lore-1][0]}</h4><p>${LORE[S.lore-1][1]}</p></div>`:''}
    <button class="act" style="width:100%;margin-top:8px" onclick="closeSheet()">Begin again</button>`);
}
function buyTalent(id){
  const t = TALENTS.find(x=>x.id===id);
  if(S.talents.includes(id) || S.footprints < t.cost) return;
  S.footprints -= t.cost; S.talents.push(id);
  if(id==='swift' && S.b.market.lv===0) S.b.market.lv = 1;
  S.kp = computeKP(S); save(); renderAll();
  toast(t.name+' unlocked.');
}
function buyPaths(){
  const c = PATHS.base + PATHS.step*S.paths;
  if(S.footprints < c) return;
  S.footprints -= c; S.paths++; save(); renderAll();
  toast('Well-Trodden Paths is now rank '+S.paths+'.');
}

/* ============================ UI ============================ */
const $ = q => document.querySelector(q);
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
function sheetHTML(html){
  $('#sheet').innerHTML = html;
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeSheet;

function stageName(d, lv){ return d.stages[Math.min(4, Math.max(0, Math.ceil(lv/2)-1))]; }

function renderNodes(){
  const wrap = $('#nodes');
  if(!wrap.dataset.built){
    wrap.innerHTML = DISTRICTS.map(d=>`
      <button class="node" data-id="${d.id}" style="left:${d.x}%;top:${d.y}%" aria-label="${d.name}">
        <span class="medal">${d.icon}</span><span class="lv"></span>
      </button>`).join('') +
      Array.from({length:6},(_,i)=>{
        const r = mulberry(i*13+5);
        return `<span class="foot" data-fi="${i}" style="left:${18+r()*62}%;top:${20+r()*62}%;--r:${Math.floor(r()*360)}deg;display:none">👣</span>`;
      }).join('');
    wrap.dataset.built = 1;
    wrap.querySelectorAll('.node').forEach(n=>n.onclick=()=>openDistrict(n.dataset.id));
  }
  DISTRICTS.forEach(d=>{
    const n = wrap.querySelector(`[data-id="${d.id}"]`), lv = S.b[d.id].lv;
    n.classList.toggle('locked', lv===0);
    const affordable = lv===0 ? canPay(S,d.unlock) : (lv<BALANCE.MAX_LEVEL && canPay(S,upgradeCost(d,lv)));
    n.classList.toggle('ready', affordable);
    n.querySelector('.lv').textContent = lv===0 ? 'locked' : 'Lv '+lv;
  });
  wrap.querySelectorAll('.foot').forEach((f,i)=>{ f.style.display = i < Math.min(6,S.ascensions) ? 'block':'none'; });
}

function openDistrict(id){
  const d = DISTRICTS.find(x=>x.id===id), lv = S.b[id].lv;
  const locked = lv===0;
  const cost = locked ? d.unlock : upgradeCost(d, lv);
  const maxed = lv >= BALANCE.MAX_LEVEL;
  const p = {}; const sc = Math.pow(BALANCE.PROD_MULT, Math.max(0,lv-1));
  for(const k in d.prod) p[k] = d.prod[k]*sc*palaceMult(S)*talentMult(S,k)*boostMult(S,k);
  const nx = {}; const sc2 = Math.pow(BALANCE.PROD_MULT, lv);
  for(const k in d.prod) nx[k] = d.prod[k]*sc2*palaceMult(S)*talentMult(S,k)*boostMult(S,k);

  sheetHTML(`
    <div class="sheet-h"><span class="medal">${d.icon}</span>
      <div><h2>${d.name}</h2><p class="stage">${locked?'Not yet open':'Level '+lv+' · '+stageName(d,lv)}</p></div></div>
    <p class="sub" style="margin:8px 0 0">${d.blurb}</p>
    ${d.id==='palace' ? `<div class="prod"><span class="chip">Kingdom-wide +${Math.round(BALANCE.PALACE_BOOST*lv*100)}%</span>
      ${!maxed?`<span class="chip">Next: +${Math.round(BALANCE.PALACE_BOOST*(lv+1)*100)}%</span>`:''}</div>`
     : `<div class="prod">${Object.keys(p).length?Object.keys(p).map(k=>
        `<span class="chip">${p[k].toFixed(2)} ${k}/s</span>`).join(''):'<span class="chip">Nothing yet</span>'}
        ${!locked&&!maxed?Object.keys(nx).map(k=>`<span class="chip" style="color:var(--gold)">→ ${nx[k].toFixed(2)}</span>`).join(''):''}</div>`}
    ${maxed ? `<p class="small">Fully built. Nothing more to add here.</p>` : `
      <div class="cost">${Object.keys(cost).map(k=>
        `<span class="chip ${S.res[k]>=cost[k]?'':'no'}">${fmt(cost[k])} ${k}</span>`).join('')}</div>
      <button class="act" style="width:100%;margin-top:8px" ${canPay(S,cost)?'':'disabled'}
        onclick="doUpgrade('${id}')">${locked?'Open this district':'Upgrade to level '+(lv+1)}</button>`}
    ${d.id==='frosttoe' && S.lore>0 ? `<p class="lore">${LORE[Math.min(S.lore,LORE.length)-1][1]}</p>`:''}
    <button class="act ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Close</button>`);
}

function openEvent(e){
  sheetHTML(`<h2>${e.ttl}</h2><p class="sub">${e.txt}</p>
    ${e.choices.map((c,i)=>{
      const need = c.need ? c.need(S) : null;
      const ok = !need || canPay(S,need);
      return `<button class="act evt-choice ${ok?'':'ghost'}" ${ok?'':'disabled'} onclick="resolveEvent('${e.id}',${i})">
        ${c.l}${need?` · ${Object.keys(need).map(k=>fmt(need[k])+' '+k).join(', ')}`:''}</button>`;
    }).join('')}`);
}
function resolveEvent(id, i){
  const e = EVENTS.find(x=>x.id===id), c = e.choices[i];
  if(c.need){ const n = c.need(S); if(!canPay(S,n)) return; pay(S,n); }
  const msg = c.fx(S);
  S.pendingEvent = null; S.d.events++; S.w.events++;
  S.kp = computeKP(S);
  closeSheet(); save(); renderAll();
  toast(msg || e.ttl+' resolved.');
}

function renderHead(){
  const p = pps(S);
  $('#kpVal').textContent = fmt(S.kp);
  const pk = Math.max(S.peak||0, S.kp), nt = nextTitle(pk);
  $('#titleNow').innerHTML = `${titleFor(pk)}<em>Streak: day ${S.streak}${nt?` · next title at ${fmt(nt[0])}`:''}</em>`;
  $('#rGold').textContent = fmt(S.res.gold); $('#sGold').textContent = p.gold.toFixed(1)+'/s';
  $('#rFood').textContent = fmt(S.res.food); $('#sFood').textContent = p.food.toFixed(1)+'/s';
  $('#rMat').textContent  = fmt(S.res.materials); $('#sMat').textContent = p.materials.toFixed(1)+'/s';
  $('#rCom').textContent  = fmt(S.res.community); $('#sCom').textContent = p.community.toFixed(2)+'/s';
  const act = [];
  if(S.festivalUntil>now()) act.push(`Festival ×${BALANCE.FESTIVAL_MULT} · ${mmss(S.festivalUntil-now())}`);
  S.boosts.forEach(b=>act.push(`${b.key} ×${b.mult} · ${mmss(b.until-now())}`));
  $('#boostBar').style.display = act.length?'block':'none';
  $('#boostBar').textContent = act.join('   ·   ');
  const dq = S.missionsD.some((m,i)=>!S.claimedD.includes(i) && progressOf(S,m,false)>=m.t)
          || S.missionsW.some((m,i)=>!S.claimedW.includes(i) && progressOf(S,m,true)>=m.t)
          || STREAK_REWARDS.some(([d])=>S.streak>=d && !S.claimedStreak.includes(d));
  document.querySelector('[data-v="quests"]').classList.toggle('alert', dq);
  document.querySelector('[data-v="realm"]').classList.toggle('alert', S.kp>=BALANCE.ASCEND_MIN_KP || S.footprints>0);
}
const mmss = ms => { const s = Math.max(0,Math.floor(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

function missionCard(m, i, weekly){
  const pr = progressOf(S,m,weekly), done = (weekly?S.claimedW:S.claimedD).includes(i);
  const ready = pr >= m.t;
  return `<div class="card ${done?'done':''}">
    <h3>${m.txt}</h3>
    <div class="bar"><i style="width:${Math.min(100,pr/m.t*100)}%"></i></div>
    <div class="rowend">
      <span class="reward">${fmt(Math.min(pr,m.t))} / ${fmt(m.t)} · ${rewardText(m.rw)}</span>
      ${done?'<span class="small">claimed</span>'
            :`<button class="act" ${ready?'':'disabled'} onclick="claimMission(${i},${weekly})">${ready?'Claim':'In progress'}</button>`}
    </div></div>`;
}
function renderQuests(){
  $('#questSub').textContent = 'Three quests, refreshed at midnight UTC.';
  $('#dailyList').innerHTML = S.missionsD.map((m,i)=>missionCard(m,i,false)).join('');
  $('#weekSub').textContent = 'Bigger goals. They reset Monday.';
  $('#weeklyList').innerHTML = S.missionsW.map((m,i)=>missionCard(m,i,true)).join('');
  $('#streakSub').textContent = `Day ${S.streak}. Best run: ${S.best} days.`;
  $('#streakList').innerHTML = STREAK_REWARDS.map(([d,label])=>{
    const got = S.claimedStreak.includes(d), ready = S.streak>=d && !got;
    return `<div class="card ${got?'done':''}"><div class="rowend" style="margin:0">
      <div><h3>Day ${d} · ${label}</h3><p>${got?'Claimed':(S.streak>=d?'Ready':`${d-S.streak} more days`)}</p></div>
      ${got?'':`<button class="act" ${ready?'':'disabled'} onclick="claimStreak(${d})">Claim</button>`}
    </div></div>`;
  }).join('');
}
function renderFestival(){
  const c = festivalCost(), open = S.b.unity.lv>0, live = S.festivalUntil>now();
  $('#festivalCard').innerHTML = !open
    ? `<h3>Festivals</h3><p>Open Unity Square to hold festivals.</p>`
    : `<div class="rowend" style="margin:0"><div>
         <h3>Hold a festival</h3>
         <p>${live?`Running · ${mmss(S.festivalUntil-now())} left`:`Everything produces 50% more for ${BALANCE.FESTIVAL_MINS} minutes.`}</p>
         <p style="color:var(--rose)">${fmt(c)} community · ${S.festivalsWeek} held this week</p></div>
       <button class="act" ${S.res.community>=c?'':'disabled'} onclick="holdFestival()">Hold</button></div>`;
}
function renderRealm(){
  const got = footprintsFor(S.kp), can = S.kp >= BALANCE.ASCEND_MIN_KP;
  $('#seg-asc').innerHTML = `
    <h2>One Step Further</h2>
    <p class="sub">Reset the kingdom and keep what you learned. Titles, collection, streak and records all stay.</p>
    <div class="card">
      <div class="rowend" style="margin:0"><div>
        <h3>${can?`Take the step for ${got} footprints`:`Reach ${fmt(BALANCE.ASCEND_MIN_KP)} power to take the step`}</h3>
        <p>You have ${S.footprints} footprints · ${S.ascensions} kingdoms built · this kingdom is worth ${fmt(S.kp)}</p></div>
        <button class="act" ${can?'':'disabled'} onclick="confirmAscend()">Step</button></div>
    </div>
    <div class="grid2" style="margin-top:10px">
      ${TALENTS.map(t=>{
        const owned = S.talents.includes(t.id);
        return `<button class="tal ${owned?'owned':''}" ${owned?'':`onclick="buyTalent('${t.id}')"`}>
          <h4>${t.name}</h4><p>${t.desc}</p>
          <span class="pr">${owned?'Walked':`${t.cost} 👣`}</span></button>`;
      }).join('')}
      <button class="tal" onclick="buyPaths()" style="grid-column:span 2">
        <h4>${PATHS.name} · rank ${S.paths}</h4><p>${PATHS.desc} Currently +${S.paths*3}%.</p>
        <span class="pr">${PATHS.base+PATHS.step*S.paths} 👣</span></button>
    </div>`;

  $('#seg-lore').innerHTML = `<h2>Records of the Realm</h2>
    <p class="sub">One page opens each time you take the step. ${S.lore} of ${LORE.length} found.</p>
    ${LORE.map(([t,x],i)=>i<S.lore
      ? `<div class="lorepage"><h4>${t}</h4><p>${x}</p></div>`
      : `<div class="lorepage hidden"><h4>Sealed page ${i+1}</h4><p>Not yet written.</p></div>`).join('')}`;

  const pk = Math.max(S.peak||0, S.kp);
  const titles = TITLES.filter(([n])=>pk>=n);
  $('#seg-coll').innerHTML = `<h2>Collection</h2>
    <p class="sub">Kept through every reset.</p>
    <div class="card"><h3>Titles · ${titles.length}/${TITLES.length}</h3>
      <p>${TITLES.map(([n,t])=>pk>=n?t:'· · ·').join(' · ')}</p></div>
    <div class="card"><h3>Relics · ${S.relics.length}</h3>
      <p>${S.relics.length?S.relics.join(' · '):'Events and streaks leave things behind. Nothing yet.'}</p></div>
    <div class="card"><h3>Kingdoms built · ${S.ascensions}</h3>
      <p>Lifetime power ${fmt(lifetimeKP(S))} · best single kingdom ${fmt(pk)}</p></div>`;
}
function confirmAscend(){
  sheetHTML(`<h2>One step further</h2>
    <p class="sub">Your districts, levels and resources reset. You keep ${footprintsFor(S.kp)} footprints, every title, your collection, your streak and your records.</p>
    <button class="act" style="width:100%" onclick="ascend()">Take the step</button>
    <button class="act ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Not yet</button>`);
}

let lbKind = 'growth';
async function renderRank(){
  const rows = await Persistence.leaderboard(lbKind, S);
  $('#lbSub').textContent = lbKind==='growth'
    ? 'Power added since Monday. Resets weekly, so a new kingdom can win it.'
    : 'Lifetime Kingdom Power across every kingdom you have built.';
  $('#lbList').innerHTML = rows.map((r,i)=>`
    <div class="lbrow ${r.me?'me':''}">
      <span class="rk">${i+1}</span>
      <span class="nm">${r.name}<br><span class="tt">${r.title}</span></span>
      <span class="vl">${fmt(lbKind==='growth'?r.growth:r.total)}</span>
    </div>`).join('');
}

/* ---- share card ---- */
function drawCard(){
  const c = $('#cardCanvas'), g = c.getContext('2d');
  const W = c.width, H = c.height;
  const bg = g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2B1940'); bg.addColorStop(.55,'#1B1029'); bg.addColorStop(1,'#120A1C');
  g.fillStyle = bg; g.fillRect(0,0,W,H);
  if(mapImgEl.complete && mapImgEl.naturalWidth){
    g.save(); g.globalAlpha = .3;
    const s = Math.max(W/mapImgEl.naturalWidth, (H*.55)/mapImgEl.naturalHeight);
    g.drawImage(mapImgEl, (W-mapImgEl.naturalWidth*s)/2, 0, mapImgEl.naturalWidth*s, mapImgEl.naturalHeight*s);
    const fade = g.createLinearGradient(0,0,0,H*.62);
    fade.addColorStop(0,'rgba(27,16,41,.25)'); fade.addColorStop(1,'#1B1029');
    g.fillStyle = fade; g.fillRect(0,0,W,H*.62); g.restore();
  }
  g.strokeStyle = '#A8813A'; g.lineWidth = 6; g.strokeRect(26,26,W-52,H-52);
  g.textAlign = 'center';
  g.fillStyle = '#E9B84C'; g.font = '700 74px Cinzel, serif';
  g.fillText('TOEZLANDIA', W/2, 150);
  g.fillStyle = '#B49FCB'; g.font = '300 28px Jost, sans-serif';
  g.fillText('A kingdom built one step at a time', W/2, 196);

  g.fillStyle = '#FFD98A'; g.font = '700 200px Cinzel, serif';
  g.fillText(fmt(S.kp), W/2, 700);
  g.fillStyle = '#B49FCB'; g.font = '400 32px Jost, sans-serif';
  g.fillText('Kingdom Power', W/2, 748);

  g.fillStyle = '#F0E3C6'; g.font = '500 46px Cinzel, serif';
  g.fillText(titleFor(Math.max(S.peak||0,S.kp)), W/2, 838);

  const stats = [
    ['Streak', S.streak+' days'],
    ['Districts', DISTRICTS.filter(d=>S.b[d.id].lv>0).length+'/8'],
    ['Kingdoms', ''+S.ascensions]
  ];
  stats.forEach(([k,v],i)=>{
    const x = W/2 + (i-1)*250;
    g.fillStyle = '#E9B84C'; g.font = '500 44px Jost, sans-serif'; g.fillText(v, x, 950);
    g.fillStyle = '#8E7CA6'; g.font = '300 24px Jost, sans-serif'; g.fillText(k, x, 986);
  });
  g.fillStyle = '#6C5C82'; g.font = '300 26px Jost, sans-serif';
  g.fillText('Different feet, same journey.', W/2, 1070);
}
$('#btnRedraw').onclick = drawCard;
$('#btnSaveCard').onclick = ()=>{
  const a = document.createElement('a');
  a.download = 'toezlandia-kingdom.png';
  a.href = $('#cardCanvas').toDataURL('image/png');
  a.click();
};

function renderAll(){ renderHead(); renderNodes(); renderQuests(); renderFestival(); renderRealm(); }

/* ---- ambient motion ---- */
const FALLS = [
  { l:26.20, t:14.84, w:2.74, h:4.69, tile:'50.0%', dur:'1.6s', src:FX_W1, edge:FXE_W1 },
  { l:65.10, t:17.50, w:2.35, h:6.09, tile:'50.0%', dur:'1.9s', src:FX_W2, edge:FXE_W2 },
  { l:61.00, t:72.81, w:4.69, h:8.05, tile:'25.0%', dur:'2.3s', src:FX_W3, edge:FXE_W3 },
  { l:49.36, t:74.84, w:9.87, h:15.62, tile:'25.0%', dur:'4.5s', src:FX_RIV, edge:FXE_RIV }
];
function cloudBand(seed, n, ry){
  const r = mulberry(seed); let s='';
  for(let i=0;i<n;i++){
    const cx = r()*100, cy = 12+r()*76, rx = 7+r()*13, o = (.18+r()*.3).toFixed(2);
    // each shape drawn twice, +100 apart, so translating -50% of a 200%-wide svg loops
    s += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry}" opacity="${o}"/>`
       + `<ellipse cx="${(cx+100).toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry}" opacity="${o}"/>`;
  }
  return s;
}
function buildFX(){
  const fx = $('#fx');
  const falls = FALLS.map(f=>
    `<div class="fall" style="--l:${f.l}%;--t:${f.t}%;--w:${f.w}%;--h:${f.h}%">
       <i style="background-image:url(&quot;${f.src}&quot;);--tile:${f.tile};--dur:${f.dur}"></i>
       <u style="background-image:url(&quot;${f.edge}&quot;)"></u></div>`).join('');

  const boats = `<div class="boats" style="--l:80.16%;--t:48.05%;--w:15.15%;--h:8.98%">
       <i style="background-image:url(&quot;${FX_BOATS}&quot;)"></i></div>`;

  const clouds = `<div class="band" style="top:0;height:26%;opacity:.62">
      <svg viewBox="0 0 200 100" preserveAspectRatio="none" style="--dur:50s">
        <defs><filter id="cbl" x="-30%" y="-60%" width="160%" height="220%">
          <feGaussianBlur stdDeviation="3.4"/></filter></defs>
        <g filter="url(#cbl)" fill="#fff">${cloudBand(41,9,5)}</g>
      </svg></div>`;

  const mist = `<div class="band" style="bottom:0;height:30%;opacity:.42">
      <svg viewBox="0 0 200 100" preserveAspectRatio="none" style="--dur:68s">
        <defs><filter id="mbl" x="-30%" y="-60%" width="160%" height="220%">
          <feGaussianBlur stdDeviation="4.6"/></filter></defs>
        <g filter="url(#mbl)" fill="#dfe9ff">${cloudBand(97,7,7)}</g>
      </svg></div>`;

  fx.innerHTML = falls + boats + clouds + mist;
}
/* motion costs battery, and this game lives in a background tab — only run it
   while the map is actually on screen */
function fxRunning(on){ $('#fx').classList.toggle('paused', !on); }

/* Explicit motion control. Default follows the OS setting; this overrides it
   both ways, so "Reduce Motion" on the phone can't silently blank the map. */
function applyMotion(){
  const on = S.motion !== false;
  document.body.classList.toggle('motion-on', on);
  document.body.classList.toggle('motion-off', !on);
  const b = $('#btnMotion');
  if(b) b.textContent = on ? 'Ambient motion: on' : 'Ambient motion: off';
}
$('#btnMotion').onclick = ()=>{ S.motion = !(S.motion !== false); applyMotion(); save(); };

/* ---- nav ---- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); $('#v-'+t.dataset.v).classList.add('on');
  fxRunning(t.dataset.v==='map');
  if(t.dataset.v==='rank'){ renderRank(); drawCard(); }
  document.querySelector('main').scrollTop = 0; // main is the only scroll region now
});
document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-seg]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['asc','lore','coll'].forEach(k=>$('#seg-'+k).style.display = k===b.dataset.seg?'block':'none');
});
document.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-lb]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); lbKind = b.dataset.lb; renderRank();
});

/* ---- boot ---- */
const mapImgEl = $('#mapImg');
mapImgEl.src = MAP_DATA;

let saveTimer = 0;
function save(){ Persistence.save(S); }
async function boot(){
  const loaded = await Persistence.load();
  S = loaded || newState();
  // migrate / defaults
  const base = newState();
  for(const k in base) if(S[k] === undefined) S[k] = base[k];
  S.lifetimeD = S.lifetimeD||0; S.lifetimeW = S.lifetimeW||0;
  DISTRICTS.forEach(d=>{ if(!S.b[d.id]) S.b[d.id] = {lv:0}; });

  const away = Math.max(0, now() - S.last);
  const capH = S.talents.includes('stones') ? 16 : BALANCE.OFFLINE_HOURS;
  const secs = Math.min(away/1000, capH*3600);
  rollover(S);
  if(!S.missionsD.length) rollMissions(S);
  if(secs > 60 && loaded){
    const before = {...S.res};
    accrue(S, secs, BALANCE.OFFLINE_RATE);
    S.d.claims++; S.w.claims++;
    const gained = DKEYS.map(k=>[k, S.res[k]-before[k]]).filter(([,v])=>v>1);
    setTimeout(()=>sheetHTML(`<h2>While you were away</h2>
      <p class="sub">${Math.floor(secs/3600)}h ${Math.floor(secs%3600/60)}m of production, at half rate.</p>
      <div class="prod">${gained.map(([k,v])=>`<span class="chip">+${fmt(v)} ${k}</span>`).join('')||'<span class="chip">Nothing yet</span>'}</div>
      <button class="act" style="width:100%;margin-top:6px" onclick="closeSheet()">Back to the kingdom</button>`), 400);
  }
  S.last = now();
  S.kp = computeKP(S);
  S.peak = Math.max(S.peak||0, S.kp);
  if(!S.lifeWeekStart) S.lifeWeekStart = lifetimeKP(S);

  renderAll();
  buildFX();
  applyMotion();
  setInterval(tick, 250);
  setInterval(()=>{ renderHead(); renderNodes(); renderFestival(); }, 600);
  setInterval(()=>{ if(dirty){ save(); dirty = false; } }, 8000);
  document.addEventListener('visibilitychange', ()=>{
    fxRunning(!document.hidden && $('[data-v="map"]').classList.contains('on'));
    if(document.hidden) save();
  });
  window.addEventListener('pagehide', save);
}
boot();
</script>
